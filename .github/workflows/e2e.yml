name: End-to-End & API Tests (Selenium, Appium, API, Load)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  run-e2e-and-api-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install openpyxl pytest pytest-json-report requests Appium-Python-Client locust

    - name: Run Unified Tests & Compile Master Report
      run: |
        python e2e_tests/generate_unified_report.py

    - name: Upload Master Test Report (.xlsx)
      uses: actions/upload-artifact@v4
      with:
        name: MediQ_Unified_Test_Reports
        path: |
          MediQ_Unified_Test_Report_*.xlsx
        retention-days: 7
