name: MediQ E2E Web & Mobile Testing & Reporting

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  run-e2e-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install openpyxl pytest pytest-json-report requests Appium-Python-Client

    - name: Run Selenium E2E Web Tests & Generate Report
      run: |
        python e2e_tests/generate_300_report.py

    - name: Run Appium E2E Mobile Tests & Generate Report
      run: |
        python appium_tests/generate_300_appium_report.py

    - name: Upload Test Reports (.xlsx)
      uses: actions/upload-artifact@v4
      with:
        name: E2E_Test_Reports
        path: |
          E2E_Test_Report_MediQ_*.xlsx
          Appium_Test_Report_MediQ_*.xlsx
        retention-days: 7
